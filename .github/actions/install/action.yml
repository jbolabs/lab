name: Install dependencies
description: Set up Node and restore node_modules from cache, running npm ci only when the lockfile changed.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    # Cache node_modules directly (not ~/.npm): a hit skips npm ci entirely.
    # The key includes the Node major because better-sqlite3 builds a native addon.
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node_modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
    - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: npm ci --no-audit --no-fund
